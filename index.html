<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>反射神経測定</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>⚡ 反射神経テスト</h1>
    <p style="color:#666;">緑になったらクリック（タップ）</p>

    <!-- ★ このボックスをクリックして反応する ★ -->
    <div id="box" class="waiting">
        <div id="mainText">👆 準備完了</div>
        <div id="sub">「スタート」を押してください</div>
    </div>

    <div id="result"></div>

    <button id="startBtn">▶ スタート</button>
    <div id="msg"></div>

    <p style="color:#aaa; font-size:14px; margin-top:30px;">（赤のうちに押すとミス → やり直し）</p>

    <script>
        // ============================================================
        //  超シンプル反射神経測定（1回のみ）
        // ============================================================

        const box = document.getElementById('box');
        const mainText = document.getElementById('mainText');
        const sub = document.getElementById('sub');
        const result = document.getElementById('result');
        const startBtn = document.getElementById('startBtn');
        const msg = document.getElementById('msg');

        let state = {
            status: 'waiting',   // waiting | ready | go | done
            timerId: null,
            startTime: 0,
        };

        function clearTimer() {
            if (state.timerId) {
                clearTimeout(state.timerId);
                state.timerId = null;
            }
        }

        function setDisplay(status, main, subText = '') {
            box.className = status;
            mainText.textContent = main;
            sub.textContent = subText;
        }

        function resetToWaiting() {
            clearTimer();
            state.status = 'waiting';
            state.startTime = 0;
            setDisplay('waiting', '👆 準備完了', '「スタート」を押してください');
            result.textContent = '';
            startBtn.textContent = '▶ スタート';
            msg.textContent = '';
        }

        function onStart() {
            resetToWaiting();

            state.status = 'ready';
            setDisplay('ready', '🔴 待ってください...', '緑になるのを待ってね');
            startBtn.disabled = true;
            msg.textContent = '';

            // 1～5秒ランダム
            const delay = Math.floor(Math.random() * 4000) + 1000;

            state.timerId = setTimeout(() => {
                state.status = 'go';
                state.startTime = performance.now();
                setDisplay('go', '🟢 クリック！！！', '今すぐ！');
                msg.textContent = '💥 今だ！';
                startBtn.disabled = true;
                state.timerId = null;
            }, delay);
        }

        function onBoxClick() {
            // --- GO（緑）: 成功！ ---
            if (state.status === 'go') {
                const endTime = performance.now();
                const ms = Math.round(endTime - state.startTime);

                state.status = 'done';
                setDisplay('done', '✅ 測定完了', `${ms} ミリ秒`);
                result.textContent = `⏱ 反射神経: ${ms} ms`;
                msg.textContent = '🎉 終了！';
                startBtn.textContent = '🔄 もう一度';
                startBtn.disabled = false;
                clearTimer();
                return;
            }

            // --- READY（赤）: ミス！ ---
            if (state.status === 'ready') {
                msg.textContent = '⚠️ まだ赤です！ 緑になってからクリック。';
                clearTimer();
                resetToWaiting();
                startBtn.disabled = false;
                msg.textContent = '❌ 早すぎました。もう一度スタートから。';
                return;
            }

            // --- それ以外 ---
            if (state.status === 'waiting' || state.status === 'done') {
                msg.textContent = '👆 先に「スタート」ボタンを押してね。';
            }
        }

        // イベント登録
        startBtn.addEventListener('click', onStart);
        box.addEventListener('click', onBoxClick);

        // スペースキーでも操作可能
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (!startBtn.disabled) {
                    onStart();
                } else {
                    onBoxClick();
                }
            }
        });

        // 初期化
        resetToWaiting();
        console.log('✅ 超シンプル反射神経テスト 準備完了');
    </script>
</body>
</html>
